name: Validate runner platform

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: runnerops-validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Hosted validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate shell syntax
        shell: bash
        run: |
          bash -n \
            configure-runner.sh \
            runners.sh \
            runner-services.sh \
            runner-runtime-env.sh \
            init-machine-config.sh \
            sync-local-git-excludes.sh \
            install-agent-skills.sh \
            runnerctl \
            install.sh \
            authorize-runtime.sh \
            runnerops-systemctl \
            runner-package.sh \
            setup-cockpit.sh \
            cache.sh \
            prewarm-cache.sh \
            prewarm-actions.sh \
            runner-cache-env.sh \
            ci-watch.sh \
            tests/test-runnerctl-contracts.sh \
            tests/test-runnerctl-routing-contracts.sh \
            tests/test-runner-package-contracts.sh \
            tests/test-ci-watch-contracts.sh \
            tests/test-agent-skills-contracts.sh \
            tests/test-performance-skill-contracts.sh \
            tests/test-lifecycle-truthfulness-contracts.sh \
            tests/test-safe-provisioning-contracts.sh \
            tests/test-legacy-diagnostics-contracts.sh \
            tests/test-noninteractive-runtime-contracts.sh

      - name: Validate Python syntax
        shell: bash
        run: |
          python3 -B -m py_compile \
            capacity.py \
            autoscale_contracts.py \
            autoscale_store.py \
            autoscale_audit.py \
            tests/test-capacity-contracts.py \
            tests/test-autoscale-audit-contracts.py

      - name: Validate XDG runtime defaults
        shell: bash
        run: |
          ACTIONS_RUNNERS_ENV="$RUNNER_TEMP/missing.env" bash -c '
            source ./runner-runtime-env.sh
            test "$RUNNERS_CONFIG" = "$HOME/.config/actions-runners/runners.conf"
            test "$RUNNER_DATA_ROOT" = "$HOME/.local/share/actions-runners/runners"
            test "$RUNNER_CACHE_ROOT" = "$HOME/.cache/actions-runners"
            test "$RUNNER_STATE_ROOT" = "$HOME/.local/state/actions-runners"
          '

      - name: Validate runnerctl
        shell: bash
        run: |
          ./runnerctl --help
          ./runnerctl --version
          ./runnerctl platform-home
          test "$(./runnerctl repo .)" = "${GITHUB_REPOSITORY,,}"
          ./runner-package.sh detect
          ./runner-package.sh --help
          XDG_CONFIG_HOME="$RUNNER_TEMP/config" RUNNERCTL_BIN_DIR="$RUNNER_TEMP/bin" ./install.sh
          XDG_CONFIG_HOME="$RUNNER_TEMP/config" "$RUNNER_TEMP/bin/runnerctl" platform-home

      - name: Validate runnerctl contracts
        shell: bash
        run: |
          bash tests/test-runnerctl-contracts.sh
          bash tests/test-runnerctl-routing-contracts.sh
          bash tests/test-runner-package-contracts.sh
          bash tests/test-ci-watch-contracts.sh
          bash tests/test-agent-skills-contracts.sh
          bash tests/test-performance-skill-contracts.sh
          bash tests/test-lifecycle-truthfulness-contracts.sh
          bash tests/test-safe-provisioning-contracts.sh
          bash tests/test-legacy-diagnostics-contracts.sh
          bash tests/test-noninteractive-runtime-contracts.sh
          python3 -B tests/test-capacity-contracts.py
          python3 -B tests/test-autoscale-audit-contracts.py

      - name: Validate governed removal plan
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/remove-fixture"
          registry="$RUNNER_TEMP/remove-runners.conf"
          mkdir -p "$fixture"
          printf '%s\n' '{"agentId":123456,"agentName":"ci-remove"}' > "$fixture/.runner"
          printf '%s\n' 'actions.runner.example.ci-remove.service' > "$fixture/.service"
          printf '%s\n' '# name|path|profile|repo|enabled|group' > "$registry"
          printf 'ci-remove|%s|generic|example/example|true|example\n' "$fixture" >> "$registry"
          before="$(sha256sum "$registry" | awk '{print $1}')"
          RUNNERS_CONFIG="$registry" ./runnerctl remove ci-remove --plan | tee "$RUNNER_TEMP/remove-plan.txt"
          grep -F -- '- runner: ci-remove' "$RUNNER_TEMP/remove-plan.txt"
          grep -F -- '- repo: example/example' "$RUNNER_TEMP/remove-plan.txt"
          grep -F -- '- systemd unit: actions.runner.example.ci-remove.service' "$RUNNER_TEMP/remove-plan.txt"
          grep -F -- '- GitHub registration: REMOVE' "$RUNNER_TEMP/remove-plan.txt"
          grep -F -- '- local directory: KEEP' "$RUNNER_TEMP/remove-plan.txt"
          after="$(sha256sum "$registry" | awk '{print $1}')"
          test "$before" = "$after"
          if RUNNERS_CONFIG="$registry" ./runnerctl remove all --plan; then
            echo "remove all should be rejected" >&2
            exit 1
          fi

      - name: Validate portable Agent Skills
        run: |
          ./install-agent-skills.sh --list
          ./install-agent-skills.sh --tool all --dry-run

      - name: Validate README brand asset
        shell: bash
        run: |
          test -s docs/images/runnerops-banner-green.jpg
          grep -F 'docs/images/runnerops-banner-green.jpg' README.md
          test -s docs/images/runnerops-social-preview.jpg

      - name: Validate RunnerOps Pages
        shell: bash
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/favicon.svg
          test -s site/i18n.js
          test -s site/social-preview.jpg
          node --check site/i18n.js
          grep -F '<title>RunnerOps' site/index.html
          grep -F 'runnerctl' site/index.html
          grep -F 'https://github.com/oalangomes/RunnerOps' site/index.html
          grep -F 'https://oalangomes.github.io/RunnerOps/social-preview.jpg' site/index.html
          grep -F 'RunnerOps v0.2.2' site/index.html
          grep -F 'data-lang="pt-BR"' site/index.html
          grep -F "'pt-BR':" site/i18n.js

      - name: Validate public portability
        shell: bash
        run: |
          if grep -R -nE '/home/alangomes|AlanGomes-PC|agentsorch|neurotrack|roboapostas|sheffield' \
            --exclude-dir=.git \
            --exclude='*.lock' \
            --exclude='validate.yml' .; then
            echo "Found maintainer-specific assumptions in tracked content." >&2
            exit 1
          fi

          owner_refs="$(
            grep -R -nF 'oalangomes/' \
              --exclude-dir=.git \
              --exclude='*.lock' \
              --exclude='validate.yml' . || true
          )"
          unexpected_owner_refs="$(
            printf '%s\n' "$owner_refs" \
              | grep -vF 'github.com/oalangomes/RunnerOps' \
              | sed '/^[[:space:]]*$/d' || true
          )"
          if [[ -n "$unexpected_owner_refs" ]]; then
            printf '%s\n' "$unexpected_owner_refs" >&2
            echo "Found unexpected maintainer-owned repository references." >&2
            exit 1
          fi

          test ! -d codex-skills

  real-ci-watch-smoke:
    name: Hosted GitHub API smoke
    if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
    needs: static-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Watch previous master SHA through GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.before }}
        run: |
          bash ./ci-watch.sh \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$TARGET_SHA" \
            --json \
            --timeout 30 \
            --interval 1 \
            --settle-polls 1

  self-hosted-dogfood:
    name: RunnerOps self-hosted dogfood
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: static-validation
    runs-on: [self-hosted, Linux, X64, runnerops, local-runner]
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify self-hosted runner identity
        shell: bash
        run: |
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test -n "$RUNNER_NAME"
          printf 'runner_name=%s\nrunner_os=%s\nrunner_arch=%s\n' \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"

      - name: Dogfood installed RunnerOps control plane
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v runnerctl >/dev/null 2>&1
          runnerctl --version
          platform_home="$(runnerctl platform-home)"
          printf 'platform_home=%s\n' "$platform_home"
          runnerctl platform-doctor
          test "$(runnerctl repo .)" = "${GITHUB_REPOSITORY,,}"

          # RunnerOps keeps a stable local id (for example runnerops-1) while
          # GitHub exposes the registered agent name (for example host-runnerops-1).
          # Reuse CapacitySnapshot's registration-id correlation instead of
          # assuming both namespaces are equal or stripping a hostname prefix.
          # shellcheck source=/dev/null
          source "$platform_home/runner-runtime-env.sh"
          capacity_json="$(python3 -B ./capacity.py "$GITHUB_REPOSITORY" --json)"
          local_runner_name="$(
            python3 -c '
          import json
          import sys

          snapshot = json.load(sys.stdin)
          remote_name = sys.argv[1].casefold()
          matches = [
              runner["name"]
              for runner in snapshot["capacity"]["runners"]
              if runner.get("scope") == "local"
              and isinstance(runner.get("github"), dict)
              and str(runner["github"].get("name", "")).casefold() == remote_name
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one local RunnerOps identity for {sys.argv[1]!r}; found {len(matches)}"
              )
          print(matches[0])
          ' "$RUNNER_NAME" <<<"$capacity_json"
          )"
          test -n "$local_runner_name"
          printf 'github_runner_name=%s\nlocal_runner_name=%s\n' \
            "$RUNNER_NAME" "$local_runner_name"

          runnerctl status "$local_runner_name"
          runnerctl health "$local_runner_name"
          runnerctl plan "$local_runner_name"

      - name: Exercise current checkout CI feedback bridge
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.before }}
        run: |
          bash ./ci-watch.sh \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$TARGET_SHA" \
            --json \
            --timeout 30 \
            --interval 1 \
            --settle-polls 1
