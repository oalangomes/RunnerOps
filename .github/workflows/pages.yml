name: Deploy RunnerOps Pages

on:
  push:
    branches:
      - master
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: runnerops-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate static site
        shell: bash
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/favicon.svg
          test -s site/i18n.js
          test -s site/social-preview.jpg
          node --check site/i18n.js
          grep -F '<title>RunnerOps' site/index.html
          grep -F 'runnerctl' site/index.html
          grep -F 'https://github.com/oalangomes/RunnerOps' site/index.html
          grep -F 'https://oalangomes.github.io/RunnerOps/social-preview.jpg' site/index.html
          grep -F 'RunnerOps v0.2.2' site/index.html
          grep -F 'data-lang="pt-BR"' site/index.html
          grep -F "'pt-BR':" site/i18n.js

  deploy:
    name: Deploy GitHub Pages
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
