name: Issue 71 non-workflow integration patch

on:
  push:
    branches:
      - feat/issue-71-governed-controller

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-71-governed-controller
          fetch-depth: 0

      - name: Apply and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"anchor count {text.count(old)} in {path}: {old[:70]!r}")
              p.write_text(text.replace(old, new, 1))

          p = Path("autoscale_controller.py")
          text, count = re.subn(
              r'def _cancel_or_fail_pending\(store, action, at, code\):.*?\n\ndef run_once\(',
              '''def _cancel_or_fail_pending(store, action, at, code):
              if action["state"] == "planned":
                  cancelled = _transition_existing(action, "cancelled", at, code, None)
                  store.record_action(cancelled)
                  return cancelled
              failed = _transition_existing(action, "failed", at, code, 1)
              store.record_action(failed)
              return failed
          
          
          def run_once(''',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("controller pending-action patch anchor missing")
          p.write_text(text)

          replay_anchor = '''            # TOCTOU guard: re-read policy after planning and before persisting or
                      # mutating. The controller never executes a plan under a new policy.
          '''
          replace_once(
              "autoscale_controller.py",
              replay_anchor,
              '''            # A deterministic plan already terminal in the audit journal must
                      # never replay its lifecycle mutation.
                      try:
                          previous = store.explain(plan_result["decision_id"])
                      except AuditError as exc:
                          if exc.code != "decision_not_found":
                              raise
                      else:
                          expected = _action_id(
                              plan_result["decision_id"], plan_result["action"]["target"]
                          )
                          matches = [item for item in previous["actions"] if item["action_id"] == expected]
                          if len(matches) != 1 or matches[0]["state"] not in (
                              "succeeded", "failed", "cancelled"
                          ):
                              return _controller_result(
                                  plan_result, status="inconclusive", diagnostic="AUDIT_REPLAY_INCONCLUSIVE"
                              ), 3
                          terminal = matches[0]
                          return _controller_result(
                              plan_result,
                              status="ok" if terminal["state"] == "succeeded" else "noop",
                              action=terminal,
                              diagnostic="ACTION_ALREADY_TERMINAL",
                          ), 0
          
                      # TOCTOU guard: re-read policy after planning and before persisting or
                      # mutating. The controller never executes a plan under a new policy.
          ''',
          )

          replace_once(
              "runnerctl",
              "  runnerctl autoscale plan [owner/repo|.] [--json]\n  runnerctl autoscale history [--since DURATION] [--json]\n",
              "  runnerctl autoscale plan [owner/repo|.] [--json]\n  runnerctl autoscale run-once [owner/repo|.] [--json]\n  runnerctl autoscale history [--since DURATION] [--json]\n",
          )
          replace_once(
              "runnerctl",
              '        status|plan|history|explain) ;;\n        *) die "autoscale aceita status, plan, history ou explain (read-only)" ;;\n',
              '        status|plan|run-once|history|explain) ;;\n        *) die "autoscale aceita status, plan, run-once, history ou explain" ;;\n',
          )
          audit_anchor = '''      if [[ "$sub" != "status" ]]; then
                  [[ -f "$PLATFORM_HOME/autoscale_audit.py" ]] || die "autoscale_audit.py ausente em: $PLATFORM_HOME"
          '''
          replace_once(
              "runnerctl",
              audit_anchor,
              '''      if [[ "$sub" == "run-once" ]]; then
                  [[ -f "$PLATFORM_HOME/autoscale_controller.py" ]] || die "autoscale_controller.py ausente em: $PLATFORM_HOME"
                  command -v python3 >/dev/null 2>&1 || die "autoscale run-once exige python3 3.8+ com módulo sqlite3"
                  python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 8) else 1)' >/dev/null 2>&1 ||
                    die "autoscale run-once exige python3 3.8+ com módulo sqlite3"
                  exec python3 -B "$PLATFORM_HOME/autoscale_controller.py" "$@"
                fi
          ''' + audit_anchor,
          )

          routing = "tests/test-runnerctl-routing-contracts.sh"
          chmod = '  chmod +x "$platform/runners.sh" "$platform/runner-services.sh" "$platform/autoscale_planner.py"\n'
          replace_once(
              routing,
              chmod,
              '''  cat > "$platform/autoscale_controller.py" <<'EOF'
          #!/usr/bin/env python3
          import os
          import sys
          with open(os.environ["TEST_CALL_LOG"], "a", encoding="utf-8") as log:
              log.write("autoscale-run-once:" + " ".join(sys.argv[1:]) + "\\n")
          EOF
          
            chmod +x "$platform/runners.sh" "$platform/runner-services.sh" "$platform/autoscale_planner.py" "$platform/autoscale_controller.py"
          ''',
          )
          marker = '''  pass "autoscale plan preserva repo/flags e usa boundary próprio"
          }
          
          main() {
          '''
          replace_once(
              routing,
              marker,
              '''  pass "autoscale plan preserva repo/flags e usa boundary próprio"
          }
          
          test_autoscale_run_once_routes_to_governed_controller() {
            local platform="$TMP_ROOT/autoscale-controller-platform"
            local log="$TMP_ROOT/autoscale-controller.log"
            make_fake_platform "$platform"
            : > "$log"
            run_ctl "$platform" "$log" autoscale run-once example/repo --json
            assert_eq \\
              'autoscale-run-once:example/repo --json' \\
              "$(cat "$log")" \\
              "runnerctl autoscale run-once deve encaminhar somente ao controller governado"
            pass "autoscale run-once preserva repo/flags e usa boundary mutável isolado"
          }
          
          main() {
          ''',
          )
          replace_once(
              routing,
              "  test_autoscale_plan_routes_to_read_only_planner\n  printf '\\nContratos de routing/lifecycle passaram.\\n'\n",
              "  test_autoscale_plan_routes_to_read_only_planner\n  test_autoscale_run_once_routes_to_governed_controller\n  printf '\\nContratos de routing/lifecycle passaram.\\n'\n",
          )

          replace_once(
              "CHANGELOG.md",
              "### Added\n\n- `runnerctl autoscale plan [owner/repo|.] [--json]`",
              "### Added\n\n- `runnerctl autoscale run-once [owner/repo|.] [--json]` introduz a primeira mutação governada do autoscaler, opt-in via `RUNNER_AUTOSCALE_ENABLED=true` e limitada a um `START_LOCAL` exato. O controller usa lock por host, revalida policy, persiste decision/action lifecycle, verifica status+health local e GitHub online e não executa `PROVISION_LOCAL`/cloud.\n- `runnerctl autoscale plan [owner/repo|.] [--json]`",
          )
          replace_once(
              "AGENTS.md",
              "Para Agent Skills:\n",
              '''Para mudanças de autoscale:
          
          ```bash
          python3 -B tests/test-capacity-contracts.py
          python3 -B tests/test-autoscale-audit-contracts.py
          python3 -B tests/test-autoscale-planner-contracts.py
          python3 -B tests/test-autoscale-controller-contracts.py
          ```
          
          Para Agent Skills:
          ''',
          )

          replace_once(
              "README.md",
              "permissões de leitura, limites e interpretação. `autoscale` oferece observabilidade,\nplanejamento read-only e leitura do histórico; ainda não existe `apply`.\n",
              "permissões de leitura, limites e interpretação. `autoscale` oferece observabilidade,\nplanejamento read-only e leitura do histórico. A primeira mutação governada é\n`autoscale run-once`, limitada a `START_LOCAL` e desabilitada por padrão.\n",
          )
          replace_once(
              "README.md",
              "[contrato do planner determinístico](docs/autoscale-planner.md).\n\n### Histórico local de autoscale\n",
              '''[contrato do planner determinístico](docs/autoscale-planner.md).
          
          ### Aplicar uma ativação local governada
          
          > Esta capacidade está em `master` e será publicada em uma release posterior à v0.2.2.
          
          ```bash
          RUNNER_AUTOSCALE_ENABLED=true runnerctl autoscale run-once .
          RUNNER_AUTOSCALE_ENABLED=true runnerctl autoscale run-once example/my-api --json
          ```
          
          O controller executa o mesmo planner determinístico e aplica **somente
          `START_LOCAL`** para um runner local exato, já provisionado, saudável e
          on-demand. `PROVISION_LOCAL` e `BURST_CLOUD` continuam sem execução.
          
          Antes de mutar, `run-once` exige lock exclusivo por host, revalida a policy e
          persiste `decision -> planned -> started`. Depois exige `status + health`
          locais e GitHub `online`; sucesso de `start` sozinho não basta. Reinícios
          reconciliam ações pendentes para evitar mutação duplicada.
          
          `RUNNER_AUTOSCALE_ENABLED` é `false` por padrão. Desabilitado, `run-once` não
          coleta snapshot, não cria SQLite/lock e não toca no lifecycle. Esta primeira
          entrega mutável é one-shot; daemon contínuo e `enable/disable` permanecem fora
          até este caminho ser provado.
          
          Veja [o contrato do controller governado](docs/autoscale-controller.md).
          
          ### Histórico local de autoscale
          ''',
          )
          replace_once(
              "README.md",
              "não criam o banco. Observações, decisões e ações são gravadas apenas pela API\nPython interna; `capacity`, `autoscale status` e `autoscale plan` continuam sem\nescrita. Banco ausente ou inválido retorna erro explícito nos leitores, inclusive\n",
              "não criam o banco. A API Python interna permanece a base de escrita; quando\nexplicitamente habilitado, `autoscale run-once` usa essa API para continuidade de\nfila e lifecycle auditável da ação. `capacity`, `autoscale status` e `autoscale plan`\ncontinuam sem escrita. Banco ausente ou inválido retorna erro explícito nos leitores, inclusive\n",
          )
          replace_once(
              "README.md",
              "`autoscale plan` não persiste o ID que produz. Portanto, `autoscale explain` só\nencontra decisões realmente registradas pela API interna; um controller futuro\nserá responsável por persistir deliberadamente a decisão antes de aplicar uma ação.\n",
              "`autoscale plan` não persiste o ID que produz. Portanto, `autoscale explain` só\nencontra decisões realmente registradas. `autoscale run-once`, ao chegar a um\n`START_LOCAL` aplicável, persiste decisão e ação antes da mutação e registra o\nresultado da verificação depois dela.\n",
          )
          PY

          bash -n runnerctl tests/test-runnerctl-routing-contracts.sh
          python3 -B -m py_compile autoscale_runtime.py autoscale_controller.py tests/test-autoscale-controller-contracts.py
          bash tests/test-runnerctl-routing-contracts.sh
          python3 -B tests/test-autoscale-controller-contracts.py

      - name: Commit non-workflow changes
        shell: bash
        run: |
          git config user.name "RunnerOps integration bot"
          git config user.email "52175262+oalangomes@users.noreply.github.com"
          git add autoscale_controller.py runnerctl tests/test-runnerctl-routing-contracts.sh README.md CHANGELOG.md AGENTS.md
          git commit -m "feat: wire governed autoscale controller (#71)"
          git push origin HEAD:feat/issue-71-governed-controller
