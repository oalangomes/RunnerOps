name: Issue 71 review hardening

on:
  push:
    branches:
      - feat/issue-71-governed-controller

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-71-governed-controller
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"anchor count={text.count(old)} in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'autoscale_controller.py',
              '''                if target_state == "online":
                              if action["state"] == "planned":
                                  action = _transition_existing(
                                      action, "started", at, "RECOVERED_ALREADY_ONLINE", 0
                                  )
                                  store.record_action(action)
                              succeeded = _transition_existing(
                                  action, "succeeded", at, "VERIFIED_ONLINE", 0
                              )
                              store.record_action(succeeded)
                              return _controller_result(
                                  plan_result,
                                  status="ok",
                                  action=succeeded,
                                  diagnostic="RECOVERED_VERIFIED_ACTION",
                              ), 0
          ''',
              '''                if target_state == "online":
                              if action["state"] == "planned":
                                  # The target became online without this persisted action ever
                                  # starting. Do not claim credit for an external/manual start.
                                  cancelled = _transition_existing(
                                      action, "cancelled", at, "TARGET_ALREADY_ONLINE", 0
                                  )
                                  store.record_action(cancelled)
                                  return _controller_result(
                                      plan_result,
                                      status="noop",
                                      action=cancelled,
                                      diagnostic="RECOVERED_NO_ACTION_REQUIRED",
                                  ), 0
                              succeeded = _transition_existing(
                                  action, "succeeded", at, "VERIFIED_ONLINE", 0
                              )
                              store.record_action(succeeded)
                              return _controller_result(
                                  plan_result,
                                  status="ok",
                                  action=succeeded,
                                  diagnostic="RECOVERED_VERIFIED_ACTION",
                              ), 0
          ''',
          )

          replace_once(
              'runnerctl',
              '''        python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 8) else 1)' >/dev/null 2>&1 ||
                    die "autoscale run-once exige python3 3.8+ com módulo sqlite3"
          ''',
              '''        python3 -c 'import sqlite3,sys; raise SystemExit(0 if sys.version_info >= (3, 8) and sqlite3.sqlite_version_info >= (3, 24, 0) else 1)' >/dev/null 2>&1 ||
                    die "autoscale run-once exige python3 3.8+ com módulo sqlite3/SQLite 3.24+"
          ''',
          )

          tests = Path('tests/test-autoscale-controller-contracts.py')
          text = tests.read_text()
          text = text.replace(
              'from autoscale_controller import run_once  # noqa: E402',
              'from autoscale_controller import ControllerError, controller_lock, run_once  # noqa: E402',
              1,
          )
          anchor = '''    def test_duplicate_iteration_over_same_queue_does_not_start_second_runner(self):
          '''
          block = '''    def test_controller_lock_rejects_concurrent_mutator(self):
                  lock = self.base / "lock-state" / "autoscale-controller.lock"
                  with controller_lock(lock):
                      with self.assertRaises(ControllerError) as raised:
                          with controller_lock(lock):
                              pass
                  self.assertEqual(raised.exception.code, "CONTROLLER_BUSY")
          
              def test_duplicate_iteration_over_same_queue_does_not_start_second_runner(self):
          '''
          if text.count(anchor) != 1:
              raise SystemExit('controller test insertion anchor missing')
          tests.write_text(text.replace(anchor, block, 1))
          PY

          python3 -B -m py_compile autoscale_controller.py tests/test-autoscale-controller-contracts.py
          bash -n runnerctl
          python3 -B tests/test-autoscale-controller-contracts.py

      - name: Commit review fixes
        shell: bash
        run: |
          git config user.name "RunnerOps integration bot"
          git config user.email "52175262+oalangomes@users.noreply.github.com"
          git add autoscale_controller.py runnerctl tests/test-autoscale-controller-contracts.py
          git commit -m "fix: harden autoscale recovery and lock contracts"
          git push origin HEAD:feat/issue-71-governed-controller
