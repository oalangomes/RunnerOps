name: Validate runner platform

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        shell: bash
        run: |
          bash -n             configure-runner.sh             runners.sh             runner-services.sh             runner-runtime-env.sh             init-machine-config.sh             sync-local-git-excludes.sh             install-agent-skills.sh             runnerctl             install.sh             setup-cockpit.sh             cache.sh             prewarm-cache.sh             prewarm-actions.sh             runner-cache-env.sh

      - name: Validate runnerctl
        shell: bash
        run: |
          ./runnerctl --help
          ./runnerctl platform-home
          XDG_CONFIG_HOME="$RUNNER_TEMP/config" RUNNERCTL_BIN_DIR="$RUNNER_TEMP/bin" ./install.sh
          XDG_CONFIG_HOME="$RUNNER_TEMP/config" "$RUNNER_TEMP/bin/runnerctl" platform-home

      - name: Validate portable Agent Skills
        run: |
          ./install-agent-skills.sh --list
          ./install-agent-skills.sh --tool all --dry-run

      - name: Validate public portability
        shell: bash
        run: |
          if grep -R -nE '/home/alangomes|oalangomes/|AlanGomes-PC|agentsorch|neurotrack|roboapostas|sheffield' \
            --exclude-dir=.git \
            --exclude='*.lock' \
            --exclude='validate.yml' .; then
            echo "Found maintainer-specific assumptions in tracked content." >&2
            exit 1
          fi
          test ! -d codex-skills
