name: Issue 71 replay corrected patch

on:
  push:
    branches:
      - feat/issue-71-governed-controller

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-71-governed-controller
          fetch-depth: 0

      - name: Replay corrected v3 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          lines = Path('.github/workflows/issue-71-patch-v3.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(lines[start:end]))
          old = '''p = Path("autoscale_controller.py")
          text, count = re.subn('''
          new = '''p = Path("autoscale_controller.py")
          source = p.read_text()
          text, count = re.subn('''
          if script.count(old) != 1:
              raise SystemExit('expected broken v3 source anchor once')
          script = script.replace(old, new, 1)
          old_arg = '''    text,
              count=1,
              flags=re.S,
          )'''
          new_arg = '''    source,
              count=1,
              flags=re.S,
          )'''
          if script.count(old_arg) != 1:
              raise SystemExit('expected broken v3 re.subn argument once')
          script = script.replace(old_arg, new_arg, 1)
          exec(compile(script, 'issue-71-v3-patch', 'exec'))
          PY

          bash -n runnerctl tests/test-runnerctl-routing-contracts.sh
          python3 -B -m py_compile autoscale_runtime.py autoscale_controller.py tests/test-autoscale-controller-contracts.py
          bash tests/test-runnerctl-routing-contracts.sh
          python3 -B tests/test-autoscale-controller-contracts.py

      - name: Commit non-workflow changes
        shell: bash
        run: |
          git config user.name "RunnerOps integration bot"
          git config user.email "52175262+oalangomes@users.noreply.github.com"
          git add autoscale_controller.py runnerctl tests/test-runnerctl-routing-contracts.sh README.md CHANGELOG.md AGENTS.md
          git commit -m "feat: wire governed autoscale controller (#71)"
          git push origin HEAD:feat/issue-71-governed-controller
