name: Validate runner platform

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      ephemeral_runner_label:
        description: Exact runnerops-ephemeral-* identity for opt-in real-host qualification
        required: false
        default: ""
        type: string
      ephemeral_action_id:
        description: Exact 32-character RunnerOps ephemeral action id
        required: false
        default: ""
        type: string
      autoscale_ephemeral_qualification:
        description: Queue one controlled job for governed local ephemeral autoscale
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: runnerops-validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Hosted validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate shell syntax
        shell: bash
        run: |
          mapfile -d '' shell_files < <(find scripts tests -type f -name '*.sh' -print0)
          bash -n runnerctl install.sh scripts/systemd/runnerops-systemctl "${shell_files[@]}"

      - name: Validate Python syntax
        shell: bash
        run: |
          mapfile -d '' python_files < <(find src tests .github/scripts -type f -name '*.py' -print0)
          python3 -B -m py_compile "${python_files[@]}"

      - name: Validate release automation
        shell: bash
        run: |
          python3 -B tests/release/test-release-version.py

      - name: Validate dogfood identity resolver
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/runner-identity"
          runner_path="$fixture/runnerops-fixture"
          workspace="$runner_path/_work/RunnerOps/RunnerOps"
          registry="$fixture/runners.conf"
          mkdir -p "$workspace"
          printf '\357\273\277%s\n' '{"agentId":42,"agentName":"host-runnerops-fixture"}' > "$runner_path/.runner"
          printf '%s|%s|generic|example/runnerops|true|runnerops\n' \
            'runnerops-fixture' "$runner_path" > "$registry"
          resolved="$(
            python3 -B .github/scripts/resolve-runner-identity.py \
              --registry "$registry" \
              --workspace "$workspace" \
              --github-runner-name 'host-runnerops-fixture'
          )"
          test "$resolved" = 'runnerops-fixture'

      - name: Validate XDG runtime defaults
        shell: bash
        run: |
          ACTIONS_RUNNERS_ENV="$RUNNER_TEMP/missing.env" bash -c '
            source ./scripts/runner/runtime-env.sh
            test "$RUNNERS_CONFIG" = "$HOME/.config/actions-runners/runners.conf"
            test "$RUNNER_DATA_ROOT" = "$HOME/.local/share/actions-runners/runners"
            test "$RUNNER_CACHE_ROOT" = "$HOME/.cache/actions-runners"
            test "$RUNNER_STATE_ROOT" = "$HOME/.local/state/actions-runners"
            test "$RUNNER_EPHEMERAL_ROOT" = "$HOME/.local/share/actions-runners/runners/.ephemeral"
            test "$RUNNER_EPHEMERAL_REGISTRATION_ABSENCE_CONFIRM_SECONDS" = "3"
          '

      - name: Validate runnerctl
        shell: bash
        run: |
          ./runnerctl --help
          ./runnerctl --version
          ./runnerctl platform-home
          test "$(./runnerctl repo .)" = "${GITHUB_REPOSITORY,,}"
          ./scripts/runner/package.sh detect
          ./scripts/runner/package.sh --help
          XDG_CONFIG_HOME="$RUNNER_TEMP/config" RUNNERCTL_BIN_DIR="$RUNNER_TEMP/bin" ./install.sh
          XDG_CONFIG_HOME="$RUNNER_TEMP/config" "$RUNNER_TEMP/bin/runnerctl" platform-home

      - name: Validate runnerctl contracts
        shell: bash
        run: |
          for test_file in tests/runner/*.sh tests/ephemeral/*.sh tests/skills/*.sh; do
            bash "$test_file"
          done
          for test_file in tests/capacity/*.py tests/operational/*.py tests/autoscale/*.py tests/ephemeral/*.py; do
            python3 -B "$test_file"
          done

      - name: Validate governed removal plan
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/remove-fixture"
          registry="$RUNNER_TEMP/remove-runners.conf"
          mkdir -p "$fixture"
          printf '%s\n' '{"agentId":123456,"agentName":"ci-remove"}' > "$fixture/.runner"
          printf '%s\n' 'actions.runner.example.ci-remove.service' > "$fixture/.service"
          printf '%s\n' '# name|path|profile|repo|enabled|group' > "$registry"
          printf 'ci-remove|%s|generic|example/example|true|example\n' "$fixture" >> "$registry"
          before="$(sha256sum "$registry" | awk '{print $1}')"
          RUNNERS_CONFIG="$registry" ./runnerctl remove ci-remove --plan | tee "$RUNNER_TEMP/remove-plan.txt"
          grep -F -- '- runner: ci-remove' "$RUNNER_TEMP/remove-plan.txt"
          grep -F -- '- repo: example/example' "$RUNNER_TEMP/remove-plan.txt"
          grep -F -- '- systemd unit: actions.runner.example.ci-remove.service' "$RUNNER_TEMP/remove-plan.txt"
          grep -F -- '- GitHub registration: REMOVE' "$RUNNER_TEMP/remove-plan.txt"
          grep -F -- '- local directory: KEEP' "$RUNNER_TEMP/remove-plan.txt"
          after="$(sha256sum "$registry" | awk '{print $1}')"
          test "$before" = "$after"
          if RUNNERS_CONFIG="$registry" ./runnerctl remove all --plan; then
            echo "remove all should be rejected" >&2
            exit 1
          fi

      - name: Validate portable Agent Skills
        run: |
          ./scripts/setup/install-agent-skills.sh --list
          ./scripts/setup/install-agent-skills.sh --tool all --dry-run

      - name: Validate README brand asset
        shell: bash
        run: |
          test -s docs/images/runnerops-banner-green.jpg
          grep -F 'docs/images/runnerops-banner-green.jpg' README.md
          test -s docs/images/runnerops-social-preview.jpg

      - name: Validate RunnerOps Pages
        shell: bash
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/favicon.svg
          test -s site/i18n.js
          test -s site/social-preview.jpg
          node --check site/i18n.js
          grep -F '<title>RunnerOps' site/index.html
          grep -F 'runnerctl' site/index.html
          grep -F 'https://github.com/oalangomes/RunnerOps' site/index.html
          grep -F 'https://oalangomes.github.io/RunnerOps/social-preview.jpg' site/index.html
          grep -F 'RunnerOps v0.5.0' site/index.html
          grep -F 'data-lang="pt-BR"' site/index.html
          grep -F "'pt-BR':" site/i18n.js

      - name: Validate public portability
        shell: bash
        run: |
          if grep -R -nE '/home/alangomes|AlanGomes-PC|agentsorch|neurotrack|roboapostas|sheffield' \
            --exclude-dir=.git \
            --exclude='*.lock' \
            --exclude='validate.yml' .; then
            echo "Found maintainer-specific assumptions in tracked content." >&2
            exit 1
          fi

          owner_refs="$(
            grep -R -nF 'oalangomes/' \
              --exclude-dir=.git \
              --exclude='*.lock' \
              --exclude='validate.yml' . || true
          )"
          unexpected_owner_refs="$(
            printf '%s\n' "$owner_refs" \
              | grep -vF 'github.com/oalangomes/RunnerOps' \
              | sed '/^[[:space:]]*$/d' || true
          )"
          if [[ -n "$unexpected_owner_refs" ]]; then
            printf '%s\n' "$unexpected_owner_refs" >&2
            echo "Found unexpected maintainer-owned repository references." >&2
            exit 1
          fi

          test ! -d codex-skills

      - name: Validate ephemeral qualification inputs
        if: github.event_name == 'workflow_dispatch' && inputs.ephemeral_runner_label != ''
        shell: bash
        env:
          EXPECTED_RUNNER: ${{ inputs.ephemeral_runner_label }}
          EXPECTED_ACTION: ${{ inputs.ephemeral_action_id }}
        run: |
          [[ "$EXPECTED_RUNNER" =~ ^runnerops-ephemeral-[a-f0-9]{16}$ ]]
          [[ "$EXPECTED_ACTION" =~ ^[a-f0-9]{32}$ ]]
          expected_suffix="$(printf '%s' "$EXPECTED_ACTION" | sha256sum | cut -c1-16)"
          test "$EXPECTED_RUNNER" = "runnerops-ephemeral-$expected_suffix"

  real-ci-watch-smoke:
    name: Hosted GitHub API smoke
    if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
    needs: static-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Classify previous master SHA through GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.before }}
        run: |
          watch_rc=0
          watch_output="$(
            bash ./scripts/ci/watch.sh \
              --repo "$GITHUB_REPOSITORY" \
              --sha "$TARGET_SHA" \
              --json \
              --timeout 30 \
              --interval 1 \
              --settle-polls 1
          )" || watch_rc=$?
          printf '%s\n' "$watch_output"
          if ! WATCH_OUTPUT="$watch_output" python3 - <<'PY'
          import json
          import os

          result = json.loads(os.environ["WATCH_OUTPUT"])
          assert result.get("repo") == os.environ["GITHUB_REPOSITORY"]
          assert result.get("sha") == os.environ["TARGET_SHA"]
          assert isinstance(result.get("status"), str) and result["status"]
          assert isinstance(result.get("kind"), str) and result["kind"]
          PY
          then
            echo "ci-watch smoke returned invalid or mismatched JSON" >&2
            exit 1
          fi
          case "$watch_rc" in
            0|1|3) ;;
            *)
              echo "ci-watch smoke failed to classify target SHA (exit=$watch_rc)" >&2
              exit "$watch_rc"
              ;;
          esac

  self-hosted-dogfood:
    name: RunnerOps self-hosted dogfood
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      inputs.ephemeral_runner_label == '' &&
      inputs.autoscale_ephemeral_qualification != true
    needs: static-validation
    runs-on: [self-hosted, Linux, X64, runnerops, local-runner]
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify self-hosted runner identity
        shell: bash
        run: |
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test -n "$RUNNER_NAME"
          printf 'runner_name=%s\nrunner_os=%s\nrunner_arch=%s\n' \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"

      - name: Dogfood current checkout against real host state
        shell: bash
        run: |
          current_runnerctl="$GITHUB_WORKSPACE/runnerctl"
          test -x "$current_runnerctl"

          # An installed runnerctl may legitimately lag behind the PR checkout.
          # Surface that fact for diagnostics, but qualify the exact checkout under test.
          installed_runnerctl="$(command -v runnerctl 2>/dev/null || true)"
          if [[ -n "$installed_runnerctl" ]]; then
            printf 'installed_runnerctl=%s\n' "$installed_runnerctl"
            "$installed_runnerctl" --version || true
          else
            printf 'installed_runnerctl=unavailable\n'
          fi

          ACTIONS_RUNNERS_HOME="$GITHUB_WORKSPACE" "$current_runnerctl" --version
          platform_home="$(
            ACTIONS_RUNNERS_HOME="$GITHUB_WORKSPACE" "$current_runnerctl" platform-home
          )"
          expected_platform_home="$(realpath -m "$GITHUB_WORKSPACE")"
          printf 'platform_home=%s\n' "$platform_home"
          test "$platform_home" = "$expected_platform_home"

          ACTIONS_RUNNERS_HOME="$platform_home" "$current_runnerctl" platform-doctor
          test "$(
            ACTIONS_RUNNERS_HOME="$platform_home" "$current_runnerctl" repo .
          )" = "${GITHUB_REPOSITORY,,}"

          # The local RunnerOps id and GitHub's agent name are separate identities.
          # Resolve the current local id from this job's workspace plus the official
          # local .runner registration metadata; no runner-admin API is required.
          # shellcheck source=/dev/null
          source "$platform_home/scripts/runner/runtime-env.sh"
          local_runner_name="$(
            python3 -B ./.github/scripts/resolve-runner-identity.py \
              --registry "$RUNNERS_CONFIG" \
              --workspace "$GITHUB_WORKSPACE" \
              --github-runner-name "$RUNNER_NAME"
          )"
          test -n "$local_runner_name"
          printf 'github_runner_name=%s\nlocal_runner_name=%s\nidentity_source=workspace+registration\n' \
            "$RUNNER_NAME" "$local_runner_name"

          ACTIONS_RUNNERS_HOME="$platform_home" "$current_runnerctl" status "$local_runner_name"
          ACTIONS_RUNNERS_HOME="$platform_home" "$current_runnerctl" health "$local_runner_name"
          ACTIONS_RUNNERS_HOME="$platform_home" "$current_runnerctl" plan "$local_runner_name"
          ACTIONS_RUNNERS_HOME="$platform_home" "$current_runnerctl" list

          run_readonly_contract() {
            local rc=0

            "$@" || rc=$?

            case "$rc" in
              0|3)
                return 0
                ;;
              *)
                echo "unexpected exit code: $rc for: $*" >&2
                return "$rc"
                ;;
            esac
          }

          ACTIONS_RUNNERS_HOME="$platform_home" \
            run_readonly_contract "$current_runnerctl" capacity .

          ACTIONS_RUNNERS_HOME="$platform_home" \
            run_readonly_contract "$current_runnerctl" autoscale status .

          ACTIONS_RUNNERS_HOME="$platform_home" \
            run_readonly_contract "$current_runnerctl" autoscale plan .

          ACTIONS_RUNNERS_HOME="$platform_home" \
            run_readonly_contract "$current_runnerctl" report . --since 24h

      - name: Exercise current checkout CI feedback bridge
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.before }}
        run: |
          watch_rc=0
          watch_output="$(
            bash ./scripts/ci/watch.sh \
              --repo "$GITHUB_REPOSITORY" \
              --sha "$TARGET_SHA" \
              --json \
              --timeout 30 \
              --interval 1 \
              --settle-polls 1
          )" || watch_rc=$?
          printf '%s\n' "$watch_output"
          if ! WATCH_OUTPUT="$watch_output" python3 - <<'PY'
          import json
          import os

          result = json.loads(os.environ["WATCH_OUTPUT"])
          assert result.get("repo") == os.environ["GITHUB_REPOSITORY"]
          assert result.get("sha") == os.environ["TARGET_SHA"]
          assert isinstance(result.get("status"), str) and result["status"]
          assert isinstance(result.get("kind"), str) and result["kind"]
          PY
          then
            echo "ci-watch dogfood returned invalid or mismatched JSON" >&2
            exit 1
          fi
          case "$watch_rc" in
            0|1|3) ;;
            *) exit "$watch_rc" ;;
          esac

  ephemeral-one-job-qualification:
    name: One controlled ephemeral job
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.ephemeral_runner_label != ''
    needs: static-validation
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ${{ inputs.ephemeral_runner_label }}
    timeout-minutes: 5
    steps:
      - name: Prove exact dispatched identity
        shell: bash
        env:
          EXPECTED_RUNNER: ${{ inputs.ephemeral_runner_label }}
          EXPECTED_ACTION: ${{ inputs.ephemeral_action_id }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RUNNER" =~ ^runnerops-ephemeral-[a-f0-9]{16}$ ]]
          [[ "$EXPECTED_ACTION" =~ ^[a-f0-9]{32}$ ]]
          expected_suffix="$(printf '%s' "$EXPECTED_ACTION" | sha256sum | cut -c1-16)"
          test "$EXPECTED_RUNNER" = "runnerops-ephemeral-$expected_suffix"
          test "$RUNNER_NAME" = "$EXPECTED_RUNNER"
          {
            echo "runner=$RUNNER_NAME"
            echo "action_id=$EXPECTED_ACTION"
            echo "host=$RUNNER_OS/$RUNNER_ARCH"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Keep BUSY observable long enough for the explicit qualification loop.
          sleep 20

  autoscale-ephemeral-qualification:
    name: Governed ephemeral autoscale job
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.autoscale_ephemeral_qualification == true
    needs: static-validation
    runs-on:
      - self-hosted
      - Linux
      - X64
      - runnerops-autoscale-ephemeral-qualification
    timeout-minutes: 5
    steps:
      - name: Prove ephemeral runner consumed one real job
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME" =~ ^runnerops-ephemeral-[a-f0-9]{16}$ ]]
          printf 'runner=%s\n' "$RUNNER_NAME" | tee -a "$GITHUB_STEP_SUMMARY"
          sleep 60
