<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">RunnerOps</title>
  <desc id="desc">Lightweight control for on-demand GitHub Actions runners, using runnerctl.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020d1b"/>
      <stop offset="1" stop-color="#06182d"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20dfff"/>
      <stop offset="1" stop-color="#168cff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="220" fill="#0aaeff" opacity=".055"/>
  <circle cx="180" cy="40" r="180" fill="#1267ff" opacity=".06"/>

  <!-- terminal logo -->
  <rect x="58" y="110" width="138" height="118" rx="26" fill="#041326" stroke="url(#cyan)" stroke-width="8"/>
  <path d="M92 145 L128 169 L92 193" fill="none" stroke="#f6fbff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M135 196 H166" stroke="#f6fbff" stroke-width="10" stroke-linecap="round"/>

  <!-- wordmark -->
  <text x="226" y="196" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="82" font-weight="800" letter-spacing="-4" fill="#f5f9ff">Runner</text>
  <text x="500" y="196" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="82" font-weight="800" letter-spacing="-4" fill="url(#cyan)">Ops</text>

  <!-- tagline -->
  <text x="60" y="278" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="500" fill="#e8eef9">Lightweight control for on-demand</text>
  <text x="60" y="326" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="600" fill="#e8eef9">GitHub Actions runners</text>

  <!-- server stack -->
  <g transform="translate(805 104)">
    <g>
      <rect x="0" y="0" width="210" height="68" rx="15" fill="#102c4b"/>
      <circle cx="26" cy="34" r="9" fill="#36ef8f"/>
      <rect x="66" y="22" width="92" height="9" rx="4.5" fill="#244f73"/>
      <rect x="66" y="39" width="68" height="8" rx="4" fill="#244f73"/>
    </g>
    <g transform="translate(0 82)">
      <rect x="0" y="0" width="210" height="68" rx="15" fill="#102c4b"/>
      <circle cx="26" cy="34" r="9" fill="#36ef8f"/>
      <rect x="66" y="22" width="92" height="9" rx="4.5" fill="#244f73"/>
      <rect x="66" y="39" width="68" height="8" rx="4" fill="#244f73"/>
    </g>
    <g transform="translate(0 164)">
      <rect x="0" y="0" width="210" height="68" rx="15" fill="#102c4b"/>
      <circle cx="26" cy="34" r="9" fill="#36ef8f"/>
      <rect x="66" y="22" width="92" height="9" rx="4.5" fill="#244f73"/>
      <rect x="66" y="39" width="68" height="8" rx="4" fill="#244f73"/>
    </g>
  </g>

  <!-- workflow mark -->
  <g transform="translate(1040 74)" stroke="#20dfff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <circle cx="42" cy="38" r="28"/>
    <path d="M34 24 L55 38 L34 52 Z" fill="#36ef8f" stroke="none"/>
    <path d="M42 66 V112 H102"/>
    <circle cx="110" cy="112" r="14"/>
    <path d="M110 126 V165 H156"/>
    <circle cx="164" cy="165" r="14"/>
  </g>

  <!-- terminal panel -->
  <g transform="translate(930 280)">
    <rect x="0" y="0" width="295" height="190" rx="18" fill="#041326" stroke="#244f73" stroke-width="4"/>
    <rect x="0" y="0" width="295" height="40" rx="18" fill="#0c2037"/>
    <rect x="0" y="24" width="295" height="16" fill="#0c2037"/>
    <circle cx="22" cy="20" r="7" fill="#ff5f57"/>
    <circle cx="44" cy="20" r="7" fill="#febc2e"/>
    <circle cx="66" cy="20" r="7" fill="#28c840"/>
    <text x="24" y="79" font-family="SFMono-Regular,Consolas,monospace" font-size="22" fill="#20dfff">$</text>
    <text x="50" y="79" font-family="SFMono-Regular,Consolas,monospace" font-size="22" fill="#f5f9ff">runnerctl start</text>
    <text x="24" y="119" font-family="SFMono-Regular,Consolas,monospace" font-size="22" fill="#20dfff">$</text>
    <text x="50" y="119" font-family="SFMono-Regular,Consolas,monospace" font-size="22" fill="#f5f9ff">runnerctl status</text>
    <text x="24" y="159" font-family="SFMono-Regular,Consolas,monospace" font-size="22" fill="#20dfff">$</text>
    <text x="50" y="159" font-family="SFMono-Regular,Consolas,monospace" font-size="22" fill="#f5f9ff">runnerctl stop</text>
  </g>

  <!-- bottom features -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(64 430)">
      <path d="M28 0 L5 44 H26 L18 78 L60 27 H38 L48 0 Z" fill="#20dfff"/>
      <text x="76" y="31" font-size="22" font-weight="700" fill="#f5f9ff">On-demand</text>
      <text x="76" y="58" font-size="22" font-weight="700" fill="#f5f9ff">runners</text>
    </g>
    <line x1="330" y1="432" x2="330" y2="510" stroke="#244f73" stroke-width="2"/>
    <g transform="translate(370 430)">
      <circle cx="34" cy="36" r="30" fill="#071a30" stroke="#20dfff" stroke-width="4"/>
      <text x="25" y="46" font-size="27" fill="#f5f9ff">L</text>
      <text x="82" y="31" font-size="22" font-weight="700" fill="#f5f9ff">Linux +</text>
      <text x="82" y="58" font-size="22" font-weight="700" fill="#f5f9ff">systemd</text>
    </g>
    <line x1="640" y1="432" x2="640" y2="510" stroke="#244f73" stroke-width="2"/>
    <g transform="translate(682 430)">
      <circle cx="34" cy="36" r="30" fill="#f5f9ff"/>
      <text x="23" y="46" font-size="28" font-weight="800" fill="#06182d">GH</text>
      <text x="82" y="31" font-size="22" font-weight="700" fill="#f5f9ff">Built for</text>
      <text x="82" y="58" font-size="22" font-weight="700" fill="#f5f9ff">GitHub Actions</text>
    </g>
    <line x1="970" y1="432" x2="970" y2="510" stroke="#244f73" stroke-width="2"/>
    <g transform="translate(1010 430)">
      <path d="M34 0 L62 12 V36 C62 57 49 72 34 80 C19 72 6 57 6 36 V12 Z" fill="none" stroke="#36ef8f" stroke-width="5"/>
      <path d="M20 39 L30 49 L49 27" fill="none" stroke="#36ef8f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="31" font-size="22" font-weight="700" fill="#f5f9ff">Simple and</text>
      <text x="82" y="58" font-size="22" font-weight="700" fill="#f5f9ff">secure</text>
    </g>
  </g>

  <text x="1088" y="585" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#7892b5">by oalangomes</text>
</svg>